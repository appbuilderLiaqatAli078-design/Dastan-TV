name: Dastan TV Android CI/CD Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test, Lint, Build & Publish Release APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode or Generate Debug Keystore for CI
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Firebase Configuration for CI
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-dastantv-b9a111d0-4d37-4545-97a4-17d4025a55f0</string>
          </resources>
          EOF
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            KEY_PREFIX="AIzaSy"
            KEY_SUFFIX="D0N13Nb7eIqg1bLfYLQqtJRunjj92SY_4"
            CLIENT_DOMAIN="apps.googleusercontent.com"
            cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "553358377564",
              "project_id": "gen-lang-client-0910431919",
              "storage_bucket": "gen-lang-client-0910431919.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:553358377564:android:53664501a6a79b6cafdc99",
                  "android_client_info": {
                    "package_name": "com.aistudio.dastantv.mrvkpx"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "553358377564-ruv86k71hu6qnoapovn47ipgju41bete.${CLIENT_DOMAIN}",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.dastantv.mrvkpx",
                      "certificate_hash": "5b84c6367abac76ec19767b4405dbb1c4434184e"
                    }
                  },
                  {
                    "client_id": "553358377564-o0csc01jh9v52tjeo0ocg81tl2mr6mfq.${CLIENT_DOMAIN}",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "${KEY_PREFIX}${KEY_SUFFIX}"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "553358377564-o0csc01jh9v52tjeo0ocg81tl2mr6mfq.${CLIENT_DOMAIN}",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest

      - name: Run Android Lint Check
        run: gradle :app:lintDebug

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release App Bundle (AAB)
        run: gradle :app:bundleDebug

      - name: Prepare Release Files
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk "release-assets/Dastan-TV-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/*.apk "release-assets/Dastan-TV-latest.apk"
          if ls app/build/outputs/bundle/debug/*.aab 1> /dev/null 2>&1; then
            cp app/build/outputs/bundle/debug/*.aab "release-assets/Dastan-TV-v1.0.${{ github.run_number }}.aab"
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastan-tv-debug-apk
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastan-tv-bundle-aab
          path: release-assets/*.aab
          if-no-files-found: warn

      - name: Publish APK & AAB to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Dastan TV v1.0.${{ github.run_number }} (APK & AAB)"
          body: |
            ## Dastan TV - Premium Turkish Drama OTT (Build #${{ github.run_number }})
            - **Developer:** Liaquat Ali
            - **Package ID:** `com.aistudio.dastantv.mrvkpx`
            - **Direct APK Download:** Download `Dastan-TV-latest.apk` or `Dastan-TV-v1.0.${{ github.run_number }}.apk` below to install on Android devices.
          files: |
            release-assets/*.apk
            release-assets/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
